name: Update Dashboard

on:
  schedule:
    # Daily at 6 AM EST (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install PyGithub pyyaml requests

      - name: Generate dashboard data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'SCRIPT'
          import os
          import json
          import yaml
          import requests
          from datetime import datetime, date
          from github import Github

          gh = Github(os.environ['GITHUB_TOKEN'])
          org_name = os.environ.get('GITHUB_REPOSITORY', '').split('/')[0]

          data = {
              "generated_at": datetime.now().strftime('%Y-%m-%d %H:%M'),
              "students": [],
              "attention_items": [],
              "metrics": {
                  "total_commits": 0,
                  "prs_merged": 0
              },
              "action_items": {
                  "open": 0,
                  "overdue": 0
              },
              "upcoming_meetings": []
          }

          # Try to fetch meeting data from lab-handbook (public) or lab-meetings (private)
          rotation = None

          # First try lab-handbook (public)
          try:
              handbook_url = f"https://raw.githubusercontent.com/{org_name}/lab-handbook/main/.github/meeting-rotation.yml"
              resp = requests.get(handbook_url)
              if resp.status_code == 200:
                  rotation = yaml.safe_load(resp.text)
                  print(f"Loaded meeting data from lab-handbook")
              else:
                  print(f"lab-handbook meeting-rotation.yml not found: {resp.status_code}")
          except Exception as e:
              print(f"Error fetching from lab-handbook: {e}")

          # Fallback to lab-meetings if lab-handbook failed
          if not rotation:
              try:
                  meetings_url = f"https://raw.githubusercontent.com/{org_name}/lab-meetings/main/schedule/rotation.yml"
                  resp = requests.get(meetings_url)
                  if resp.status_code == 200:
                      rotation = yaml.safe_load(resp.text)
                      print(f"Loaded meeting data from lab-meetings")
              except Exception as e:
                  print(f"Error fetching from lab-meetings: {e}")

          if rotation:
              # Get students from roster (lab-meetings) or lab_members (lab-handbook)
              roster = rotation.get('roster') or rotation.get('lab_members', [])
              for member in roster:
                  data['students'].append({
                      'name': member['name'],
                      'github': member.get('github', ''),
                      'status': 'good'
                  })

              # Get upcoming meetings from schedule (lab-meetings) or meetings (lab-handbook)
              schedule = rotation.get('schedule') or rotation.get('meetings', [])
              today = date.today()
              upcoming = []
              for meeting in schedule:
                  meeting_date = datetime.strptime(meeting['date'], '%Y-%m-%d').date()
                  if meeting_date >= today:
                      # Format date nicely
                      date_str = meeting_date.strftime('%b %d')
                      # Handle different field names
                      presenter = meeting.get('leader') or meeting.get('lead', 'TBD')
                      topic = meeting.get('type') or meeting.get('topic', 'Meeting')
                      if isinstance(topic, str):
                          topic = topic.replace('-', ' ').replace('_', ' ').title()
                      upcoming.append({
                          'date': date_str,
                          'presenter': presenter,
                          'topic': topic,
                          'status': 'not-started'
                      })
              # Take next 4 meetings
              data['upcoming_meetings'] = upcoming[:4]
          else:
              print("Could not load meeting data from any source")

          # Try to get action items from lab-meetings issues
          try:
              repo = gh.get_repo(f"{org_name}/lab-meetings")
              issues = list(repo.get_issues(state='open', labels=['action-item']))
              data['action_items']['open'] = len(issues)

              overdue = [i for i in issues if any(l.name == 'overdue' for l in i.labels)]
              data['action_items']['overdue'] = len(overdue)

              # Add overdue items to attention
              for issue in overdue[:3]:
                  assignee = issue.assignee.login if issue.assignee else 'unassigned'
                  data['attention_items'].append({
                      'student': assignee,
                      'message': f'Overdue: {issue.title.replace("[ACTION] ", "")}',
                      'severity': 'high'
                  })
          except Exception as e:
              print(f"Could not fetch lab-meetings issues: {e}")

          with open('docs/data/lab-status.json', 'w') as f:
              json.dump(data, f, indent=2)

          print("Dashboard data updated")
          print(f"Students: {len(data['students'])}")
          print(f"Upcoming meetings: {len(data['upcoming_meetings'])}")
          SCRIPT

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update dashboard"
          file_pattern: "docs/data/*.json"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
